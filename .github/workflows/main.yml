name: masterworkflows 

on: 
  push:

jobs: 
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: |
          pwd
          ls -ltr
          hostname
      - name: checkout 
        uses: actions/checkout@v5.0.0
      - name: step3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
          ls -ltr
          hostname
      - name: Upload a single file
        uses: actions/upload-artifact@v5.0.0
        with:
          name: single file
          path: ./myartifact.txt
      
      - name: upload from directory
        uses: actions/upload-artifact@v5.0.0
        with:
          name: directory_artifacts
          path: /artifacts

      - name: upload from multiple paths
        uses: actions/upload-artifact@v5.0.0
        with:
          name: multiple_paths
          path: | 
            ./myartifact.txt
            ./artifacts
      - name: upload from multiple paths with exclusions
        uses: actions/upload-artifact@v5.0.0
        with:
          name: multiple_paths_with_exclusion
          path: | 
            ./myartifact.txt
            ./artifacts
            !**/hostname.txt
         
 
  job2:
    name: JOB3
    runs-on: ubuntu-latest
    steps:
      - name: checking current directoy
        run: | 
          pwd
          ls -ltr
      - name: download single file artifact
        uses: actions/download-artifact@v6.0.0
        with:
          name: single_file
      - name: checking current directoy post download
        run: |
          pwd
          ls -ltr

          
      